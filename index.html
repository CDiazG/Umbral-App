/* ===== UMBRAL · CLEAN & MODERN ===== */
:root{--bg:#F6F7F8;--sf:#FFFFFF;--ink:#1F2933;--ink2:rgba(31,41,51,.65);--ln:rgba(31,41,51,.10);--ln2:rgba(31,41,51,.18);--bl:#36719F;--bl2:#2D5F86;--bls:rgba(54,113,159,.08);--onbl:#fff;--ring:rgba(54,113,159,.25);--sg:#3F7A63;--sgs:rgba(63,122,99,.10);--rd:#B4493F;--rds:rgba(180,73,63,.08);--am:#A8721F;--ams:rgba(168,114,31,.10);--font:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--sol:#36719F;--mar:#36719F;--hondo:#1F2933;--mid:#36719F}
html.dk{color-scheme:dark;--bg:#101317;--sf:#181C21;--ink:#E6E8EA;--ink2:rgba(230,232,234,.62);--ln:rgba(230,232,234,.12);--ln2:rgba(230,232,234,.22);--bl:#7FB0D9;--bl2:#9CC3E3;--bls:rgba(127,176,217,.14);--onbl:#101317;--ring:rgba(127,176,217,.35);--sg:#7DBF9E;--sgs:rgba(125,191,158,.14);--rd:#E0877D;--rds:rgba(224,135,125,.13);--am:#D9AE62;--ams:rgba(217,174,98,.13);--sol:#7FB0D9;--mar:#7FB0D9;--hondo:#E6E8EA}
html{background:var(--bg)}
body{font:400 14px/1.5 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:var(--font)}
::selection{background:var(--bls)}
/* barra superior */
#top{background:var(--sf);color:var(--ink);border-bottom:1px solid var(--ln);padding:10px 20px;gap:10px;align-items:center}
#top strong{font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--ink)}
#top .sep{color:var(--ln2);font-size:18px}
#top b{font-size:14px;font-weight:500;color:var(--ink2)}
#top span{color:var(--ink2);font-size:13px}
#modo{background:var(--bls)!important;color:var(--bl)!important;border:0!important;font-size:12px!important;font-weight:500!important;padding:3px 10px!important}
.lgo{width:30px;height:30px;flex:none;margin-right:0;filter:none}
/* barra de filtros */
header{background:var(--sf);color:var(--ink);border-bottom:1px solid var(--ln);padding:14px 20px}
header label{color:var(--ink2);font-size:12px;font-weight:500}
header button,header button:hover:not(:disabled){border-color:var(--ln2)}
header button:hover:not(:disabled){background:var(--bg);color:var(--ink)}header button.p:hover:not(:disabled){background:var(--bl2);border-color:var(--bl2);color:var(--onbl)}
/* botones */
button{font:500 14px/1.2 var(--font);color:var(--ink);background:var(--sf);border:1px solid var(--ln2);border-radius:8px;padding:8px 14px;min-height:36px;transition:background .15s,border-color .15s,box-shadow .15s}
button:hover:not(:disabled){background:var(--bg);border-color:var(--ln2)}
button:active:not(:disabled){background:var(--ln)}
button.p{background:var(--bl);border-color:var(--bl);color:var(--onbl)}
button.p:hover:not(:disabled){background:var(--bl2);border-color:var(--bl2);color:var(--onbl)}
button:disabled{opacity:.45;cursor:default}
button.lkb{border-color:var(--ln2);color:var(--bl)}button.lkb.on{background:var(--bls);color:var(--bl)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
/* campos */
input,select,textarea{background:var(--sf);color:var(--ink);border:1px solid var(--ln2);border-radius:8px;padding:8px 12px;font:400 14px/1.4 var(--font)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--bl);box-shadow:0 0 0 3px var(--ring)}
input::placeholder,textarea::placeholder{color:var(--ink2);opacity:.7}
input:disabled,textarea:disabled,select:disabled{background:var(--bg);color:var(--ink2);-webkit-text-fill-color:var(--ink2);border-color:var(--ln)}
select option{background:var(--sf);color:var(--ink)}
input[type=checkbox],input[type=radio]{accent-color:var(--bl)}
input.bad{border-color:var(--rd)!important;background:var(--rds)}input.warn{border-color:var(--am)!important;background:var(--ams)}input.good{border-color:var(--sg)!important;background:var(--sf)}
#ed label,.nf label,.pf label{color:var(--ink2);font-size:12px;font-weight:500}
/* títulos */
.v h2,h2{font-size:24px;font-weight:600;letter-spacing:-.01em;color:var(--ink);margin:0 0 4px}
.v>p,p{color:var(--ink2)}
h3{font-size:16px;font-weight:600;color:var(--ink)}
a{color:var(--bl)}
/* tarjetas */
.cd,.mh,.fi,.nf,#ed,#list,.tbw{background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:12px;box-shadow:none}
.mh,.fi,.nf,#ed{padding:20px}.mh{margin-bottom:16px}

try{let r=await ghFetch('');if(r.status===401)throw new Error('El token no es válido o ha caducado. Crea uno nuevo en GitHub y pégalo aquí.');if(r.status===404)throw new Error('No encuentro ese repositorio o el token no tiene acceso a él. Revisa el nombre (usuario/repositorio) y que el token incluya ese repositorio.');if(!r.ok)throw new Error('GitHub respondió con error '+r.status+'.');
r=await ghFetch('/contents/version.json',1);if(r.status===404){GH.ok='Conectado a GitHub. Todavía no hay versiones publicadas en el repositorio.';GH.last=Date.now();GH.busy=0;ghUi();return}if(!r.ok)throw new Error('No se pudo leer la versión publicada ('+r.status+').');
const v=JSON.parse(await r.text());GH.latest=+v.b||0;if(v.v)VMAP[GH.latest]=v.v;let c=null;try{c=await upKv('get','app')}catch(x){}
const have=Math.max(BUILD,c&&c.b||0);GH.have=have;
if(GH.latest>have){r=await ghFetch('/contents/umbral.html',1);if(!r.ok)throw new Error('No se pudo descargar la versión nueva ('+r.status+').');const txt=await r.text(),i=upInfo(txt);if(!i||i.b!==GH.latest)throw new Error('El archivo descargado no es una versión válida del programa; no lo he instalado.');await upKv('set','app',{t:txt,b:i.b,d:i.d});vf(i.b,i.v);GH.ready=i.b;GH.ok='Versión '+vf(i.b)+' descargada. Se activa al reiniciar el programa.';ghAsk(i.b,i.d)}
else{GH.ok=(GH.ready>BUILD||(c&&c.b>BUILD))?'Versión '+vf(Math.max(GH.ready,c?c.b:0))+' descargada. Se activa al reiniciar el programa.':'Estás al día (versión '+VER+').'}
GH.last=Date.now()}catch(x){GH.err=(x&&x.message)||'error'}
GH.busy=0;ghUi()}
function ghAsk(b,d){if(GH.asked>=b)return;GH.asked=b;try{fxModal('ghu',`<div style="text-align:center;padding:6px 4px 2px"><div style="font-size:34px;line-height:1">⬆️</div><h3 style="margin:10px 0 6px">Hay una versión nueva de Umbral</h3><p style="margin:0 0 4px;color:var(--mut,#666)">Versión <b>${vf(b)}</b>${d?' · '+e(d):''}. Ya está descargada.</p><p style="margin:0 0 16px;color:var(--mut,#666);font-size:13px">Tus datos se conservan. El programa se recargará en unos segundos.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button id="ghu_l" onclick="document.getElementById('ghu').remove()">Posponer</button><button class="p" id="ghu_n" onclick="ghNow()">Actualizar ahora</button></div><p style="margin:12px 0 0;font-size:12px;color:var(--mut,#888)">Si pospones, el aviso queda en el menú lateral y se aplica la próxima vez que abras el programa.</p></div>`,420)}catch(x){}}
async function ghNow(){const b=document.getElementById('ghu_n'),l=document.getElementById('ghu_l');if(b){b.disabled=true;b.textContent='Guardando…'}if(l)l.disabled=true;try{if(typeof clPush=='function'&&typeof CL!='undefined'&&CL.db&&LSX.getItem('fl_syncd'))await Promise.race([clPush(),new Promise(r=>setTimeout(r,5000))])}catch(x){}location.reload()}
function ghUi(){try{gbn();if(CUR=='aju')rAju()}catch(x){}}
function ghSave(){const g=id=>(document.getElementById(id)||{value:''}).value.trim(),r=g('gh_r').replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/,'').replace(/\/+$/,''),t=g('gh_t');
if(!/^[\w.-]+\/[\w.-]+$/.test(r)||!t){GH.err='Escribe el repositorio como usuario/nombre (por ejemplo carlos/umbral) y pega el token.';ghUi();return}
try{const o=ghCfg();window.localStorage.setItem('fx_gh',JSON.stringify({r,t,e:g('gh_e'),s:(o&&o.t===t&&o.s)||iso(TODAY)}))}catch(x){}GH.err='';ghCheck(1)}
function ghOff(){try{window.localStorage.removeItem('fx_gh')}catch(x){}GH.ok='';GH.err='';ghUi()}
async function ghOrig(){try{await upKv('del','app')}catch(x){}location.href=location.pathname+'#original';location.reload()}
function tokInfo(){const c=ghCfg();if(!c||!OFFL)return null;let exp=c.e||'',est=false;if(!exp&&c.s){const d=new Date(c.s+'T00:00:00');d.setFullYear(d.getFullYear()+1);exp=iso(d);est=true}return exp?{exp,est,d:days(exp)}:null}
function tokWarn(){const t=tokInfo();if(!t||t.d>30)return'';return `<div class="av w" style="cursor:pointer" onclick="show('aju')">🔑 ${t.d<0?'El token de GitHub caducó el '+fd(t.exp)+'. Las actualizaciones automáticas ya no funcionarán hasta que crees uno nuevo.':'El token de GitHub caduca'+(t.est?' (fecha estimada)':'')+' el '+fd(t.exp)+' ('+dl(t.d)+'). Crea uno nuevo antes para no perder las actualizaciones automáticas.'} →</div>`}
function ghExp(){const c=ghCfg(),v=(document.getElementById('gh_e')||{}).value||'';if(!c)return;c.e=v;try{window.localStorage.setItem('fx_gh',JSON.stringify(c))}catch(x){}ghUi();try{rAju()}catch(x){}}
function ghHtml(){if(!OFFL)return'';const H='<h2 style="margin-top:22px;font-size:17px">Actualizaciones automáticas</h2>',c=ghCfg();
if(c)return H+`<p>Al abrir, el programa mira si hay una versión nueva en <b>${e(c.r)}</b> y la descarga sola. Se activa al reiniciar. Versión en uso: <b>${VER}</b>.</p>${GH.busy?'<p>Comprobando…</p>':GH.err?`<p class="wn2">${e(GH.err)}</p>`:GH.ok?`<p class="${/descargada/.test(GH.ok)?'wn2':'ok'}"><b>${e(GH.ok)}</b>${GH.last?' · '+new Date(GH.last).toLocaleTimeString('es-ES'):''}</p>`:''}${(()=>{const t=tokInfo();return `<p style="margin:0 0 8px">Caducidad del token: <input type="date" id="gh_e" value="${e(c.e||'')}" style="max-width:170px" onchange="ghExp()"> ${t?(t.d<0?'<b class="wn">caducado</b>':t.d<=30?'<b class="wn2">caduca '+dl(t.d)+'</b>':'<small>'+(t.est?'estimada: ':'')+fd(t.exp)+' ('+dl(t.d)+')</small>'):'<small>apúntala para que te avise un mes antes</small>'}</p>`})()}<p><button class="p" onclick="ghCheck(1)">Buscar actualización ahora</button> ${GH.ready>BUILD?'<button onclick="location.reload()">Reiniciar ahora</button> ':''}<button onclick="ghOff()">Quitar</button></p><p style="color:var(--ink2);font-size:13px">Si una versión diera problemas, abre el programa con <b>#original</b> al final de la dirección, o pulsa <a href="#" onclick="ghOrig();return false">usar la versión original del archivo</a>.</p>`;
return H+`<p>Para que el programa se actualice solo al abrirlo, conéctalo a tu repositorio privado de GitHub. Se hace una vez.</p>${GH.err?`<p class="wn2">${e(GH.err)}</p>`:''}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin:0 0 8px"><label>Repositorio (usuario/nombre)<input id="gh_r" autocomplete="off" placeholder="micuenta/umbral"></label><label>Token de acceso (solo lectura)<input id="gh_t" type="password" autocomplete="off" placeholder="github_pat_…" onkeydown="if(event.key==='Enter')ghSave()"></label><label>Caduca el (la ves al crearlo)<input id="gh_e" type="date"></label></div><p><button class="p" onclick="ghSave()">Guardar y comprobar</button></p><details><summary style="cursor:pointer">Cómo crear el token</summary><ol style="padding-left:20px;line-height:1.5"><li>En GitHub: tu foto › <b>Settings › Developer settings › Personal access tokens › Fine-grained tokens › Generate new token</b>.</li><li>Nombre «umbral», caducidad la máxima (1 año; apúntate renovarlo).</li><li><b>Repository access › Only select repositories</b> y elige <b>umbral</b>.</li><li><b>Permissions › Repository permissions › Contents: Read-only</b>. Nada más.</li><li>Pulsa <b>Generate token</b>, cópialo y pégalo aquí.</li></ol></details>`}
if(OFFL){setTimeout(()=>ghCheck(),4000);window.addEventListener('focus',()=>{if(ghCfg()&&!GH.busy&&Date.now()-GH.last>2*3600e3)ghCheck()})}

/* ===== Menú: despliegue suave y con retardo ===== */
(function(){const sd=$('side');if(!sd||sd._h)return;sd._h=1;const hv=matchMedia('(hover:hover)');
const op=(d,v)=>{d.classList.toggle('open',v);const h=d.querySelector('.gh');if(h)h.setAttribute('aria-expanded',v)};
sd.addEventListener('mouseover',ev=>{if(!hv.matches)return;const d=ev.target.closest('.gr');if(!d)return;clearTimeout(d._c);if(!d.classList.contains('open')&&!d._o)d._o=setTimeout(()=>{d._o=0;op(d,true)},300)});
sd.addEventListener('mouseout',ev=>{if(!hv.matches)return;const d=ev.target.closest('.gr');if(!d||d.contains(ev.relatedTarget))return;clearTimeout(d._o);d._o=0;if(d.querySelector('button.on'))return;clearTimeout(d._c);d._c=setTimeout(()=>op(d,false),800)});
sd.addEventListener('click',ev=>{const h=ev.target.closest('.gh');if(!h)return;const d=h.parentNode;clearTimeout(d._o);d._o=0;clearTimeout(d._c);op(d,hv.matches?true:!d.classList.contains('open'))});
sd.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList.contains('gh')){ev.preventDefault();ev.target.click()}})})();

let t=CUR=='pan'?'<span>Alquileres</span><i>›</i><b>Panel del inquilino</b>':'';for(const g of groups()){const v=g[1].find(x=>x[0]==CUR);if(v){t=(g[0]?`<span>${e(g[0])}</span><i>›</i>`:'')+`<b>${e(v[1])}</b>`;break}}el.innerHTML=CUR=='ini'?'':t;el.hidden=CUR=='ini'}

function fxModal(id,html,wide){let o=document.getElementById(id);if(o)o.remove();o=document.createElement('div');o.id=id;o.className='fxm';o.innerHTML=`<div class="fxb" style="max-width:${wide||560}px">${html}</div>`;o.addEventListener('mousedown',ev=>{if(ev.target===o)o.remove()});document.body.appendChild(o);return o}
/* ===== Buscador global (Ctrl+K) ===== */
function pal(){const rec=lsj('fl_rec',[]);let sel=0,list_=[];
const o=fxModal('pal',`<input id="pq" placeholder="Buscar pantalla, local o inquilino…" autocomplete="off"><div id="pr"></div><div class="pf2"><span>↑↓ moverse · Intro abrir · Esc cerrar</span><span>? atajos</span></div>`,620);
const q=$('pq'),pr=$('pr');
function items(){const x=lqN(q.value),res=[];const G=groups();
if(!x){rec.map(k=>T.findIndex(t=>t.k===k)).filter(i=>i>=0).slice(0,4).forEach(i=>res.push({ic:'clock',t:T[i].n,s:'Reciente · '+locOf(T[i]),go:()=>openLoc(i)}));
favs().forEach(id=>{G.forEach(g=>g[1].forEach(v=>{if(v[0]==id)res.push({ic:ICV[id]||'folder',t:v[1],s:'Favorito',go:()=>show(id)})}))});
G.forEach(g=>g[1].forEach(v=>res.push({ic:ICV[v[0]]||'folder',t:v[1],s:g[0]||'Inicio',go:()=>show(v[0])})));return res.slice(0,12)}
G.forEach(g=>g[1].forEach(v=>{const n=lqN(v[1]+' '+(g[0]||''));if(x.split(' ').every(w=>n.includes(w)))res.push({ic:ICV[v[0]]||'folder',t:v[1],s:g[0]||'Inicio',sc:2,go:()=>show(v[0])})}));
T.forEach((t,i)=>{const sc=lqScore(t,q.value);if(sc>0)res.push({ic:'building',t:t.n,s:locOf(t)+' · '+(t.no||'sin nº'),sc:1+sc/1000,i,go:()=>openLoc(i)})});
return res.sort((a,b)=>(b.sc||0)-(a.sc||0)).slice(0,9)}
function draw_(){list_=items();if(sel>=list_.length)sel=0;pr.innerHTML=list_.length?list_.map((it,i)=>`<div class="pi ${i==sel?'on':''}" data-i="${i}"><span class="mi">${icn(it.ic)}</span><span class="pt1">${e(it.t)}</span><small>${e(it.s)}</small></div>`).join(''):'<div class="pe">Sin resultados</div>'}
q.oninput=()=>{sel=0;draw_()};
q.onkeydown=ev=>{if(ev.key==='ArrowDown'){sel=Math.min(sel+1,list_.length-1);draw_();ev.preventDefault()}else if(ev.key==='ArrowUp'){sel=Math.max(sel-1,0);draw_();ev.preventDefault()}else if(ev.key==='Enter'&&list_[sel]){o.remove();list_[sel].go()}else if(ev.key==='Escape')o.remove()};
pr.onclick=ev=>{const d=ev.target.closest('.pi');if(d){o.remove();list_[+d.dataset.i].go()}};draw_();q.focus()}
/* ===== Atajos de teclado ===== */
const GK={i:'ini',f:'fac',g:'gen',c:'cob',l:'loc',q:'inq',t:'con',a:'ale',r:'res',p:'gra',e:'esp',x:'exp',n:'nue',s:'aju',d:'emp'};
function atajos(){const G=groups(),nm={};G.forEach(g=>g[1].forEach(v=>nm[v[0]]=v[1]));fxModal('atj',`<h2 style="margin:0 0 4px;font-size:18px">Atajos de teclado</h2><p style="margin:0 0 12px">Pulsa <kbd>G</kbd> y luego una letra para ir a una pantalla. <kbd>Ctrl</kbd>+<kbd>K</kbd> abre el buscador. Funcionan cuando no estás escribiendo en un campo.</p><div class="atg">${Object.entries(GK).filter(([k,id])=>nm[id]).map(([k,id])=>`<div><kbd>G</kbd> <kbd>${k.toUpperCase()}</kbd><span>${e(nm[id])}</span></div>`).join('')}<div><kbd>?</kbd><span>Esta ayuda</span></div></div><div style="margin-top:12px"><button class="p" onclick="document.getElementById('atj').remove()">Cerrar</button></div>`,560)}
(function(){let g=0;document.addEventListener('keydown',ev=>{const tg=ev.target,ty=tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable);
if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();if(window.__CO)pal();return}
if(ev.key==='Escape'){['pal','atj','ocm','dka','mkm'].forEach(i=>{const m=document.getElementById(i);if(m)m.remove()});return}
if(ty||ev.ctrlKey||ev.metaKey||ev.altKey||!window.__CO)return;
if(ev.key==='?'){atajos();return}
if(g&&Date.now()-g<1200){const id=GK[ev.key.toLowerCase()];g=0;if(id&&(groups().some(x=>x[1].some(v=>v[0]==id)))){ev.preventDefault();show(id)}return}
if(ev.key.toLowerCase()==='g'){g=Date.now()}})})();

show('ini');
